<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Smart YT Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px 30px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; color: transparent; }

        /* Install Button */
        #btnInstall {
            margin-left: auto;
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: none; /* Hidden by default until PWA is ready */
            transition: 0.2s;
        }
        #btnInstall:hover { background: var(--primary-hover); transform: scale(1.05); }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Side: Player & Info */
        .player-section {
            flex: 2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .now-playing-info {
            margin-top: 25px;
            text-align: center;
        }
        .now-playing-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .now-playing-channel { font-size: 16px; color: var(--text-muted); }

        .media-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .ctrl-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .play-pause-btn { width: 65px; height: 65px; background: var(--primary); }
        .play-pause-btn:hover { background: var(--primary-hover); }

        /* Right Side: Queue & Inputs */
        .queue-section {
            flex: 1;
            min-width: 350px;
            max-width: 450px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
        }

        /* Input Controls */
        .add-controls {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .input-group { display: flex; gap: 10px; }
        .input-group input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            color: white;
            font-family: inherit;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); }
        .input-group button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-group button:hover { background: var(--primary-hover); }

        .status-msg { font-size: 13px; color: var(--text-muted); text-align: center; min-height: 18px; }

        /* Queue List */
        .queue-header {
            padding: 15px 20px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .clear-queue { background: transparent; border: none; color: var(--text-muted); cursor: pointer; text-decoration: underline; font-size: 12px; }
        .clear-queue:hover { color: var(--danger); }

        .queue-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .queue-list::-webkit-scrollbar { width: 6px; }
        .queue-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .queue-item:hover { background: rgba(255,255,255,0.05); }
        .queue-item.active { background: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.3); }

        .queue-thumb { width: 60px; height: 45px; border-radius: 4px; object-fit: cover; background: #000; flex-shrink: 0;}
        .queue-info { flex: 1; overflow: hidden; }
        .queue-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;}
        .queue-channel { font-size: 12px; color: var(--text-muted); }
        
        .remove-btn {
            background: transparent; border: none; color: var(--text-muted); cursor: pointer;
            padding: 5px; opacity: 0; transition: 0.2s;
        }
        .queue-item:hover .remove-btn { opacity: 1; }
        .remove-btn:hover { color: var(--danger); }

        /* Responsive */
        @media (max-width: 900px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .container { 
                flex-direction: column; 
                overflow: visible;
            }
            .player-section { 
                flex: none; 
                border-right: none; 
                border-bottom: 1px solid var(--border); 
                padding: 15px; 
                overflow-y: visible;
            }
            .queue-section { 
                flex: none; 
                max-width: 100%; 
                min-width: 100%; 
            }
            .queue-list {
                overflow-y: visible;
            }
        }
    </style>
</head>
<body>

    <header>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#818cf8" /><stop offset="100%" stop-color="#c084fc" /></linearGradient></defs>
            <circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
        <h1>Aura Player</h1>
        <button id="btnInstall">Install App</button>
    </header>

    <div class="container">
        <!-- Player Section -->
        <div class="player-section">
            <div class="video-container">
                <div id="youtube-player"></div>
            </div>
            
            <div class="now-playing-info">
                <div class="now-playing-title" id="npTitle">Ready to Play</div>
                <div class="now-playing-channel" id="npChannel">Add a song or playlist to get started</div>
            </div>

            <div class="media-controls">
                <button class="ctrl-btn" id="btnPrev" title="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause-btn" id="btnPlayPause" title="Play/Pause">
                    <!-- Default to Play icon -->
                    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="ctrl-btn" id="btnNext" title="Next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Queue Section -->
        <div class="queue-section">
            <div class="add-controls">
                <div class="input-group">
                    <input type="text" id="addInput" placeholder="Search song or paste YT link...">
                    <button id="btnAdd">Add</button>
                </div>
                <div class="input-group">
                    <input type="text" id="playlistInput" placeholder="Paste YouTube Playlist link...">
                    <button id="btnImport">Import</button>
                </div>
                <div class="status-msg" id="statusMsg"></div>
            </div>

            <div class="queue-header">
                <span>Up Next (<span id="queueCount">0</span>)</span>
                <button class="clear-queue" id="btnClearQueue">Clear All</button>
            </div>
            
            <div class="queue-list" id="queueList">
                <!-- Queue items injected here -->
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const API_KEY = 'AIzaSyBFTCtKzfMfpaj3aFjFPLbaysw5atwy_LA';
        
        let player;
        let queue = [];
        let currentIndex = -1;
        let isPlaying = false;

        // UI Elements
        const addInput = document.getElementById('addInput');
        const btnAdd = document.getElementById('btnAdd');
        const playlistInput = document.getElementById('playlistInput');
        const btnImport = document.getElementById('btnImport');
        const statusMsg = document.getElementById('statusMsg');
        const queueList = document.getElementById('queueList');
        const queueCount = document.getElementById('queueCount');
        
        const npTitle = document.getElementById('npTitle');
        const npChannel = document.getElementById('npChannel');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');

        // --- YOUTUBE IFRAME API INITIALIZATION ---
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: '', // Re-added this to properly structure the iframe on load
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'showinfo': 0
                    // Removed 'origin' which was causing the player to crash on local computers
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            console.log("Player Ready");
        }

        function onPlayerStateChange(event) {
            // Update Play/Pause UI based on YT player state
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.CUED) {
                isPlaying = false;
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            } else if (event.data === YT.PlayerState.ENDED) {
                // Auto-play next song
                playNext();
            }
        }

        function onPlayerError(event) {
            console.error("Video Error:", event.data);
            let msg = "Error playing video. Skipping to next...";
            if (event.data === 150 || event.data === 101 || event.data === 153) {
                msg = "Playback blocked by YouTube. Skipping...";
            }
            showStatus(msg, true);
            setTimeout(playNext, 2000);
        }

        // --- MEDIA CONTROLS LOGIC ---
        btnPlayPause.addEventListener('click', () => {
            if (!player || queue.length === 0) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) playTrack(currentIndex - 1);
        });

        btnNext.addEventListener('click', playNext);

        function playNext() {
            if (currentIndex < queue.length - 1) {
                playTrack(currentIndex + 1);
            } else {
                // End of queue
                player.stopVideo();
                isPlaying = false;
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            }
        }

        function playTrack(index) {
            if (index < 0 || index >= queue.length) return;
            currentIndex = index;
            const track = queue[index];
            
            // Update UI
            npTitle.innerText = track.title;
            npChannel.innerText = track.channel;
            renderQueue(); // Update active state in list

            // Load and play in iframe
            if (player && player.loadVideoById) {
                player.loadVideoById(track.id);
            }
        }

        // --- QUEUE MANAGEMENT ---
        function renderQueue() {
            queueList.innerHTML = '';
            queueCount.innerText = queue.length;

            queue.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `queue-item ${index === currentIndex ? 'active' : ''}`;
                
                item.innerHTML = `
                    <img class="queue-thumb" src="${track.thumb}" alt="thumb">
                    <div class="queue-info">
                        <div class="queue-title" title="${track.title}">${track.title}</div>
                        <div class="queue-channel">${track.channel}</div>
                    </div>
                    <button class="remove-btn" title="Remove" onclick="removeTrack(event, ${index})">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
                
                // Click to play this track
                item.addEventListener('click', () => playTrack(index));
                queueList.appendChild(item);
            });

            // Auto-scroll to active item
            const activeItem = queueList.querySelector('.active');
            if(activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        window.removeTrack = function(event, index) {
            event.stopPropagation(); // Prevent playing the track when clicking remove
            queue.splice(index, 1);
            
            // Adjust current index if necessary
            if (index < currentIndex) {
                currentIndex--;
            } else if (index === currentIndex) {
                // If we deleted the currently playing track
                if (queue.length > 0) {
                    playTrack(Math.min(currentIndex, queue.length - 1));
                } else {
                    // Queue empty
                    currentIndex = -1;
                    player.stopVideo();
                    npTitle.innerText = "Queue Empty";
                    npChannel.innerText = "";
                }
            }
            renderQueue();
        };

        document.getElementById('btnClearQueue').addEventListener('click', () => {
            queue = [];
            currentIndex = -1;
            player.stopVideo();
            npTitle.innerText = "Queue Empty";
            npChannel.innerText = "";
            renderQueue();
        });

        // --- DATA FETCHING (YOUTUBE DATA API) ---
        function showStatus(msg, isError = false) {
            statusMsg.innerText = msg;
            statusMsg.style.color = isError ? "var(--danger)" : "var(--text-muted)";
            setTimeout(() => { statusMsg.innerText = ''; }, 4000);
        }

        // 1. Add Single Song (URL or Search)
        btnAdd.addEventListener('click', async () => {
            const val = addInput.value.trim();
            if (!val) return;
            addInput.value = '';
            showStatus("Searching...");

            // Check if it's a URL
            let videoId = extractVideoId(val);
            
            try {
                if (videoId) {
                    // Fetch by ID
                    const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${API_KEY}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        addTrackToQueue(data.items[0]);
                    } else {
                        showStatus("Video not found.", true);
                    }
                } else {
                    // It's a search query
                    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=${encodeURIComponent(val)}&type=video&key=${API_KEY}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        // The search API returns id as an object: { videoId: "..." }
                        const item = data.items[0];
                        item.id = item.id.videoId; // Normalize ID location
                        addTrackToQueue(item);
                    } else {
                        showStatus("No results found.", true);
                    }
                }
            } catch (error) {
                console.error(error);
                showStatus("Error fetching data.", true);
            }
        });

        addInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') btnAdd.click(); });

        // 2. Import Playlist
        btnImport.addEventListener('click', async () => {
            const val = playlistInput.value.trim();
            if (!val) return;
            
            const playlistId = extractPlaylistId(val);
            if (!playlistId) {
                showStatus("Invalid Playlist URL.", true);
                return;
            }

            playlistInput.value = '';
            showStatus("Importing playlist...");

            try {
                // Note: maxResults=50 is the API limit per page. For simplicity, we fetch the first 50.
                const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);

                if (data.items && data.items.length > 0) {
                    let addedCount = 0;
                    data.items.forEach(item => {
                        // Filter out private/deleted videos (they usually lack a title or have a specific default title)
                        if (item.snippet.title !== "Private video" && item.snippet.title !== "Deleted video") {
                            item.id = item.snippet.resourceId.videoId; // Normalize ID
                            queue.push(formatTrackData(item));
                            addedCount++;
                        }
                    });

                    renderQueue();
                    showStatus(`Imported ${addedCount} songs!`);
                    
                    // If this is the first thing added, start playing immediately
                    if (currentIndex === -1 && queue.length > 0) {
                        playTrack(0);
                    }
                } else {
                    showStatus("Playlist is empty or private.", true);
                }
            } catch (error) {
                console.error(error);
                showStatus("Error importing playlist.", true);
            }
        });

        // --- HELPERS ---
        function formatTrackData(item) {
            return {
                id: item.id,
                title: item.snippet.title,
                channel: item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle,
                thumb: item.snippet.thumbnails?.default?.url || 'https://via.placeholder.com/60x45?text=No+Thumb'
            };
        }

        function addTrackToQueue(apiItem) {
            queue.push(formatTrackData(apiItem));
            renderQueue();
            showStatus("Song added!");
            
            // Auto-play if it's the only song
            if (queue.length === 1 && currentIndex === -1) {
                playTrack(0);
            }
        }

        function extractVideoId(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : false;
        }

        function extractPlaylistId(url) {
            const regExp = /[?&]list=([^#\&\?]+)/;
            const match = url.match(regExp);
            return match ? match[1] : url; // Assume they pasted the raw ID if regex fails
        }

        // --- PWA & NETWORK LOGIC ---
        
        // 1. Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered successfully'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // 2. Install Prompt Handling
        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI to notify the user they can add to home screen
            btnInstall.style.display = 'block';
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Show the install prompt
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstall.style.display = 'none';
                }
                // We've used the prompt, and can't use it again, throw it away
                deferredPrompt = null;
            }
        });

        // 3. Offline/Online Detection
        window.addEventListener('offline', () => {
            showStatus("You are offline! Aura requires an internet connection.", true);
            document.body.style.opacity = '0.7';
            document.body.style.pointerEvents = 'none';
        });

        window.addEventListener('online', () => {
            showStatus("Connection restored! You're back online.");
            document.body.style.opacity = '1';
            document.body.style.pointerEvents = 'auto';
        });

    </script>
</body>
</html>
